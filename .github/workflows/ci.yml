name: Heart Disease MLOps CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test-and-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: flake8 src tests --max-line-length=100

      - name: Download dataset
        run: python -m src.data

      - name: Run unit tests
        run: PYTHONPATH=. pytest -q

      - name: Start MLflow server
        run: |
          mlflow server \
            --host 127.0.0.1 \
            --port 5000 \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root ./mlartifacts > mlflow.log 2>&1 &

          for i in {1..30}; do
            if curl -sf http://127.0.0.1:5000/health; then
              echo "MLflow server is ready"
              break
            fi

            echo "Waiting for MLflow server..."
            sleep 2
          done

      - name: Train model
        run: python -m src.train

      - name: Build Docker image
        run: docker build -t heart-disease-api:ci .

      - name: Upload ML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ml-artifacts
          path: |
            models/
            reports/figures/
            mlartifacts/
            mlflow.log